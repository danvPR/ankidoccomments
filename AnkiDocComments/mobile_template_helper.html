<!-- AnkiDocComments Mobile Template Helper -->
<!-- Paste this into your card template (Front or Back) for read-only comment viewing on mobile -->
<!-- Generated by AnkiDocComments addon -->

<style id="ankidoccomments-mobile-css">
:root {
  --comment-highlight-bg-light: #fff0b3;
  --comment-highlight-bg-dark: #4a421b;
  --comment-highlight-border: #e6c94a;
  --comment-resolved-bg-light: #e0e0e0;
  --comment-resolved-bg-dark: #3a3a3a;
  --popover-bg: #ffffff;
  --popover-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  --accent-color: #1a73e8;
  --text-primary: #202124;
  --text-secondary: #5f6368;
  --border-color: #dadce0;
  --input-bg: #ffffff;
  --hover-bg: #f1f3f4;
  --success-color: #188038;
}
.nightMode, body.nightMode {
  --comment-highlight-bg: var(--comment-highlight-bg-dark);
  --comment-resolved-bg: var(--comment-resolved-bg-dark);
  --popover-bg: #2d2d2d;
  --popover-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  --text-primary: #e8eaed;
  --text-secondary: #9aa0a6;
  --border-color: #3c4043;
  --input-bg: #3c4043;
  --hover-bg: #3c4043;
}
:root:not(.nightMode) body:not(.nightMode) {
  --comment-highlight-bg: var(--comment-highlight-bg-light);
  --comment-resolved-bg: var(--comment-resolved-bg-light);
}
.anki-field { display: contents; }
.gdoc-comment { touch-action: manipulation; background-color: var(--comment-highlight-bg);
  border-bottom: 2px solid var(--comment-highlight-border);
  cursor: pointer;
  padding: 0 2px;
  border-radius: 2px;
  transition: background-color 0.15s ease;
}
.gdoc-comment:hover { background-color: var(--comment-highlight-border); }
.gdoc-comment.resolved {
  background-color: var(--comment-resolved-bg);
  border-bottom-color: var(--text-secondary);
  opacity: 0.7;
}
.anki-comment-popover-mobile {
  position: fixed;
  background: var(--popover-bg);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  box-shadow: var(--popover-shadow);
  padding: 10px;
  width: 350px;
  max-width: calc(100vw - 24px);
  z-index: 9999;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px;
  color: var(--text-primary);
  animation: popover-fade-in 150ms ease-out;
}
@keyframes popover-fade-in {
  from { opacity: 0; transform: scale(0.95) translateY(-4px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.popover-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border-color);
  font-weight: 600;
  font-size: 13px;
}
.popover-field { font-weight: 400; font-size: 12px; color: var(--text-secondary); background: var(--hover-bg); padding: 2px 8px; border-radius: 4px; }
.popover-close { background: none; border: none; font-size: 24px; line-height: 1; color: var(--text-secondary); cursor: pointer; padding: 0 8px; border-radius: 4px; }
.popover-close:hover { background: var(--hover-bg); color: var(--text-primary); }
.popover-threads { max-height: 50vh; overflow-y: auto; }
.comment-thread { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
.comment-thread:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.comment-reply { display: flex; gap: 10px; }
.comment-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-color); color: white; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; margin-top: 2px; }
.comment-body { flex: 1; min-width: 0; }
.comment-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
.comment-author { font-weight: 600; color: var(--text-primary); }
.comment-time { color: var(--text-secondary); }
.comment-content { line-height: 1.6; word-wrap: break-word; white-space: pre-wrap; }
.anki-comment-spoiler { border-radius: 3px; }
.comment-content .anki-comment-spoiler:not(.revealed) {
  color: transparent !important;
  background: #5f6368;
  cursor: pointer;
  user-select: none;
}
.comment-content .anki-comment-spoiler.revealed { cursor: pointer; }
.popover-resolved { text-align: center; padding: 12px; color: var(--success-color); font-weight: 500; font-size: 14px; background: rgba(24, 128, 56, 0.1); border-radius: 8px; margin-top: 8px; }
</style>

<script>
(function() {
  'use strict';

  // Do not run on desktop Anki (addon already handles comments)
  if (window.ankiDocCommentsInit) {
    return;
  }

  function findCommentData(mark) {
    const field = mark.dataset.field;
    const dataDiv = document.getElementById('anki-comments-data-' + field);
    if (!dataDiv) return null;
    try {
      return (JSON.parse(dataDiv.textContent || '{}'))[mark.dataset.cid] || null;
    } catch (e) {
      console.warn('AnkiDocComments: Failed to parse comment data', e);
      return null;
    }
  }

  let lastMobileActivation = 0;

  function handleMarkActivation(e) {
    const mark = e.target && e.target.closest ? e.target.closest('mark.gdoc-comment') : null;
    if (!mark) return;
    const now = Date.now();
    if (now - lastMobileActivation < 500) return;
    lastMobileActivation = now;
    const commentData = findCommentData(mark);
    if (!commentData) return;
    e.preventDefault();
    e.stopPropagation();
    showMobilePopover(mark, commentData, mark.dataset.field);
  }

  document.addEventListener('click', handleMarkActivation, true);
  document.addEventListener('touchend', handleMarkActivation, true);
  document.addEventListener('click', handleSpoilerActivation, true);
  document.addEventListener('keydown', handleSpoilerKeydown, true);

  function handleSpoilerActivation(e) {
    const spoiler = e.target && e.target.closest
      ? e.target.closest('.anki-comment-popover-mobile .comment-content .anki-comment-spoiler')
      : null;
    if (spoiler) toggleSpoiler(spoiler);
  }

  function handleSpoilerKeydown(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const spoiler = e.target && e.target.closest
      ? e.target.closest('.anki-comment-popover-mobile .comment-content .anki-comment-spoiler')
      : null;
    if (!spoiler) return;
    e.preventDefault();
    toggleSpoiler(spoiler);
  }

  function toggleSpoiler(spoiler) {
    const revealed = spoiler.classList.toggle('revealed');
    spoiler.setAttribute('aria-expanded', String(revealed));
  }

  function showMobilePopover(markEl, commentData, fieldName) {
    const existing = document.querySelector('.anki-comment-popover-mobile');
    if (existing) existing.remove();

    const popover = document.createElement('div');
    popover.className = 'anki-comment-popover anki-comment-popover-mobile';
    popover.innerHTML = renderPopoverContent(commentData, fieldName);

    document.body.appendChild(popover);
    positionPopover(popover, markEl);

    const closeBtn = popover.querySelector('.popover-close');
    if (closeBtn) closeBtn.addEventListener('click', () => popover.remove());

    function closeOnOutside(e) {
      if (!popover.contains(e.target) && e.target !== markEl) {
        popover.remove();
        document.removeEventListener('click', closeOnOutside);
        document.removeEventListener('touchstart', closeOnOutside);
      }
    }

    setTimeout(() => {
      document.addEventListener('click', closeOnOutside);
      document.addEventListener('touchstart', closeOnOutside, { passive: true });
    }, 0);
  }

  function renderPopoverContent(commentData, fieldName) {
    let html = '<div class="popover-header">Comments <span class="popover-field">(' + escapeHtml(fieldName) + ')</span><button class="popover-close" aria-label="Close">&times;</button></div>';
    html += '<div class="popover-threads">';

    (commentData.threads || []).forEach(thread => {
      const author = String(thread.author || '?');
      const date = formatTimestamp(thread.timestamp);
      html += '<div class="comment-thread">';
      html += '  <div class="comment-reply">';
      html += '    <div class="comment-avatar">' + escapeHtml(author.charAt(0).toUpperCase()) + '</div>';
      html += '    <div class="comment-body">';
      html += '      <div class="comment-meta">';
      html += '        <span class="comment-author">' + escapeHtml(author) + '</span>';
      html += '        <span class="comment-time">' + escapeHtml(date) + '</span>';
      html += '      </div>';
      html += '      <div class="comment-content">' + sanitizeCommentHtml(thread.content_html) + '</div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';
    });

    html += '</div>';
    if (commentData.resolved) {
      html += '<div class="popover-resolved">✓ Resolved</div>';
    }
    return html;
  }

  function positionPopover(popover, anchor) {
    const rect = anchor.getBoundingClientRect();
    const popoverRect = popover.getBoundingClientRect();

    let left = rect.left + rect.width / 2 - popoverRect.width / 2;
    let top = rect.bottom + 8;

    if (left < 8) left = 8;
    if (left + popoverRect.width > window.innerWidth - 8) {
      left = window.innerWidth - popoverRect.width - 8;
    }

    if (top + popoverRect.height > window.innerHeight - 8) {
      top = rect.top - popoverRect.height - 8;
    }

    popover.style.left = left + 'px';
    popover.style.top = top + 'px';
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text == null ? '' : String(text);
    return div.innerHTML;
  }

  function sanitizeCommentHtml(content) {
    const template = document.createElement('template');
    template.innerHTML = String(content || '');
    const allowedTags = new Set([
      'B', 'I', 'U', 'STRONG', 'EM', 'SPAN', 'BR',
      'P', 'DIV', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'A', 'FONT',
    ]);

    function renderNode(node) {
      if (node.nodeType === Node.TEXT_NODE) return escapeHtml(node.nodeValue);
      if (node.nodeType !== Node.ELEMENT_NODE) return '';
      const sourceTag = node.tagName.toLowerCase();
      const tag = sourceTag === 'font' ? 'span' : sourceTag;
      const children = Array.from(node.childNodes).map(renderNode).join('');
      if (!allowedTags.has(node.tagName)) return children;
      if (tag === 'br') return '<br>';

      let style = '';
      const color = node.style.color || node.getAttribute('color') || '';
      if (tag === 'span') {
        if (node.getAttribute('class') === 'anki-comment-spoiler') {
          style = ' class="anki-comment-spoiler" role="button" tabindex="0" aria-expanded="false" title="Bấm để hiện hoặc ẩn"';
        }
        if (/^#[0-9a-f]{6}$/i.test(color)) {
          style += ' style="color:' + color + '"';
        }
      } else if (tag === 'a') {
        const href = node.getAttribute('href') || '';
        try {
          const protocol = new URL(href, window.location.href).protocol;
          if (['http:', 'https:', 'mailto:'].includes(protocol)) {
            style = ' href="' + href.replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '"';
          }
        } catch (e) {
          return children;
        }
      }
      return '<' + tag + style + '>' + children + '</' + tag + '>';
    }

    return Array.from(template.content.childNodes).map(renderNode).join('');
  }

  function formatTimestamp(timestamp) {
    const value = String(timestamp || '');
    const normalized = /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(value)
      ? value.replace(' ', 'T') + ':00'
      : value;
    const date = new Date(normalized);
    return Number.isNaN(date.getTime()) ? value : date.toLocaleString();
  }

  // no-op init; event delegation handles taps/clicks
})();
</script>
